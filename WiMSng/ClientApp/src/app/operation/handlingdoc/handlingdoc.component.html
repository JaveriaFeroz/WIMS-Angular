<form [formGroup]="frmHandlingDoc">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Update Container Type/Quantity</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb100">
          <mat-label>Doc Type</mat-label>
          <mat-select formControlName="docTypeId" required>
            <mat-option *ngFor="let dt of lstDocType" [value]="dt.id">{{dt.name}}</mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb250">
          <mat-label>Warehouse</mat-label>
          <mat-select formControlName="whId" required>
            <mat-option *ngFor="let wh of lstWarehouse" [value]="wh.whId">{{wh.whName}}</mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>Storer Key</mat-label>
          <input formControlName="storerKey" matTooltip="Enter Storer Key" matInput maxlength="15" required>
        </mat-form-field>
      </td>

      <td>
          <mat-form-field class="tb150">
            <mat-label>Document #</mat-label>
            <input formControlName="docNo" matTooltip="Enter ASN/SO #" matInput maxlength="20" required>
          </mat-form-field>
      </td>
      <td>
        <button type="button" id="btnLoad" matTooltip="Click to Load Data" (click)="tbLoad()" class="load"></button>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb150">
          <mat-label>Ref #</mat-label>
          <input formControlName="customerRefNo" matTooltip="Customer Ref  #" matInput maxlength="40" readonly>
        </mat-form-field>
      </td>
      <td class="slider">
        <mat-slide-toggle formControlName="coLoad" color="primary" matTooltip="Turn on Co-Load flag to let system know that this document handling won't be charged">Co-Load?</mat-slide-toggle>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb200">
          <mat-label>Container Type 1</mat-label>
          <mat-select formControlName="containerType1">
            <mat-option *ngFor="let ct of lstContainerType" [value]="ct.typeId">{{ct.typeName}}</mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>Qty</mat-label>
          <input type="number" formControlName="qty1" min="0" matTooltip="Enter Container Qty 1" matInput maxlength="9">
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb200">
          <mat-label>Container Type 2</mat-label>
          <mat-select formControlName="containerType2">
            <mat-option *ngFor="let ct of lstContainerType" [value]="ct.typeId">{{ct.typeName}}</mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>Qty</mat-label>
          <input type="number" formControlName="qty2" min="0" matTooltip="Enter Container Qty 2" matInput maxlength="9">
        </mat-form-field>
      </td>
    </tr>
    <tr>
      <td colspan="2">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
