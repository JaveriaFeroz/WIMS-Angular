<form [formGroup]="frmWFRateSheet">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Client Rate Setup Request</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <div id="divSave" class="float-left">
            <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"
                    *ngIf="frmWFRateSheet.get('stateId').value==0 || frmWFRateSheet.get('stateId').value==1 ||  frmWFRateSheet.get('stateId').value==5 "></button>
          </div>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>
    <tr>
      <td>
        <mat-form-field class="tb70" color="accent">
          <mat-label>Form #</mat-label>
          <input formControlName="formId" #formId matTooltip="Form Id, auto generated for new entry" matInput maxlength="4" numbersOnly (keydown.enter)="get(formId.value)">
        </mat-form-field>
      </td>
      <!--<td></td>-->

      <td>
        <mat-form-field class="tb200">
          <mat-label>Status</mat-label>
          <input formControlName="stateName" matInput readonly tabindex="-1">
          <input formControlName="stateId" matInput hidden>
          <input formControlName="owner" matInput hidden>
          <input formControlName="completed" matInput hidden>
          <!--<input formControlName="rateSheetId" matInput hidden>-->
        </mat-form-field>
      </td>
      <td class="slider">
        <mat-slide-toggle formControlName="isActive" color="primary">Rate Sheet Active?</mat-slide-toggle>
      </td>
      <td colspan="4"></td>
      <td></td>
      <td colspan="2" rowspan="3">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb250">
          <mat-label>Storer Group</mat-label>
          <mat-select (selectionChange)="loadExisting()" formControlName="storerGroupId" #storerGroupId required>
            <mat-option *ngFor="let sg of lstStorerGroup" [value]="sg.groupId">{{sg.groupName}}</mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <!--<td>
        <mat-form-field class="tb250">
          <mat-label>WareHouse</mat-label>
          <mat-select (selectionChange)="onWarehouseChange()" formControlName="whId" required>
            <mat-option *ngFor="let WH of lstWarehouse" [value]="WH.whId">
              {{WH.whName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>-->

      <td>
        <mat-form-field class="tb200">
          <mat-label>Profit Center</mat-label>
          <mat-select (selectionChange)="loadExisting()" formControlName="pcId" required>
            <mat-option *ngFor="let pc of lstProfitCenter" [value]="pc.pcId">{{pc.pcName}}</mat-option>
          </mat-select>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb200">
          <mat-label>Invoice Calendar</mat-label>
          <mat-select formControlName="calendarId" required>
            <mat-option *ngFor="let ic of lstInvCalendar" [value]="ic.calendarId">{{ic.calendarName}}</mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb200">
          <mat-label>KAM</mat-label>
          <mat-select formControlName="kamId" matToolTip="Select Key Account Manager for this customer" required>
            <mat-option *ngFor="let ka of lstKAM" [value]="ka.kamId">{{ka.kamName}}</mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>Expiry Date </mat-label>
          <input matInput [matDatepicker]="mdpEDate" [min]="minDate" [max]="maxDate" matTooltip="Expiry Date" formControlName="expiryDate" required>
          <mat-datepicker-toggle matSuffix [for]="mdpEDate"></mat-datepicker-toggle>
          <mat-datepicker #mdpEDate></mat-datepicker>
        </mat-form-field>      
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>Min Inv Amount</mat-label>
          <input type="number" formControlName="minInvAmount" min="0" step="0.5" max="999999999" matTooltip="Enter Minimum invoice value to be charged incase actual charges are below this amount" maxlength="9" matInput oninput="validity.valid||(value='');">
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="10">
          <mat-tab-group (selectedTabChange)="validateGridStatus()">
            <mat-tab label="Storage Charges" style="background-color:green;">
              <div class="divStorage">
                <div class="divStorageRate">
                  <div class="grdToolbar" id="tbGrid">
                    <button type="button" (click)="onAddRSLine()" class="add" title="Add Line Item"></button>
                    <button type="button" (click)="onDeleteRSLine()" class="delete" title="Remove selected line item"></button>
                  </div>
                  <ag-grid-angular class="ag-theme-balham grdStorage" [gridOptions]="goStorage" id="grdStorage"
                    [frameworkComponents]="frameworkComponents" [columnDefs]="colStorage" (cellValueChanged)="onStorageCellValueChanged($event)"
                    (rowClicked)="onStorageRowSelected($event)" [rowData]="storageData"></ag-grid-angular>
                </div>
                <div class="divStorageLoc">
                  <div class="grdToolbarSmall" id="tbGrid">
                    <button type="button" *ngIf="frmWFRateSheet.get('showLC').value" (click)="onAddRSLLine()" class="add" title="Add Line Item"></button>
                    <button type="button" *ngIf="frmWFRateSheet.get('showLC').value" (click)="onDeleteRSLLine()" class="delete" title="Remove selected line item"></button>
                  </div>
                  <ag-grid-angular class="ag-theme-balham grdStorageLoc" [gridOptions]="goStorageLoc" id="grdStorageLoc"
                      (cellValueChanged)="onRSLCellValueChanged($event)" [columnDefs]="colStorageLoc" [rowData]="storageLocData"></ag-grid-angular>
                </div>
              </div>                  
            </mat-tab>
            <mat-tab label="Handling Charges">
              <div class="divHandling">
                <div class="divHandlingRate">
                  <div class="grdToolbar" id="tbGrid">
                    <button type="button" (click)="onAddRHLine()" class="add" title="Add Line Item"></button>
                    <button type="button" (click)="onDeleteRHLine()" class="delete" title="Remove selected line item"></button>
                  </div>
                  <ag-grid-angular class="ag-theme-balham grdHandling" [gridOptions]="goHandling" [frameworkComponents]="frameworkComponents" id="grdHandling"
                                   [columnDefs]="colHandling" (rowClicked)="onHandlingRowSelected($event)" [rowData]="handlingData" (cellValueChanged)="onHandlingCellValueChanged($event)"></ag-grid-angular>
                </div>
                <div class="divHandlingContainer" [hidden]="containerHidden" >
                  <div class="grdToolbarSmall" id="tbGrid">
                    <button type="button" *ngIf="frmWFRateSheet.get('showContainer').value" (click)="onAddRHCLine()" class="add" title="Add Line Item"></button>
                    <button type="button" *ngIf="frmWFRateSheet.get('showContainer').value" (click)="onDeleteRHCLine()" class="delete" title="Remove selected line item"></button>
                  </div>
                  <ag-grid-angular class="ag-theme-balham grdHandlingContainer" [gridOptions]="goHandlingContainer" id="grdHandlingContainer"
                    (cellValueChanged)="onRHCCellValueChanged($event)" [columnDefs]="colHandlingContainer" [rowData]="handlingContainerData"></ag-grid-angular>
                </div>
                <div class="divHandlingSKU" [hidden]="skuHidden">
                  <div class="grdToolbarSmall" id="tbGrid">
                    <button type="button" *ngIf="frmWFRateSheet.get('showSKU').value" (click)="onAddRHSLine()" class="add" title="Add Line Item"></button>
                    <button type="button" *ngIf="frmWFRateSheet.get('showSKU').value" (click)="onDeleteRHSLine()" class="delete" title="Remove selected line item"></button>
                  </div>
                  <ag-grid-angular class="ag-theme-balham grdHandlingSKU" [gridOptions]="goHandlingSKU" id="grdHandlingSKU"
                    (cellValueChanged)="onRHSCellValueChanged($event)" [columnDefs]="colHandlingSKU" [rowData]="handlingSKUData"></ag-grid-angular>
                </div>
              </div>
            </mat-tab>

            <mat-tab label="Accessorial Charges">
              <div class="divAccessorial">
                <div class="divVariable">
                  <div class="grdToolbar" id="tbGrid">
                    <button type="button" (click)="onAddRVALine()" class="add" title="Add Line Item"></button>
                    <button type="button" (click)="onDeleteRVALine()" class="delete" title="Remove selected line item"></button>
                  </div>
                  <ag-grid-angular class="ag-theme-balham grdVariable" [gridOptions]="goVariable" [frameworkComponents]="frameworkComponents" id="grdVariable"
                                   [columnDefs]="colVariable" [rowData]="variableData"></ag-grid-angular>
                </div>
                <div class="divFixed">
                  <div class="grdToolbar" id="tbGrid">
                    <button type="button" (click)="onAddRFALine()" class="add" title="Add Line Item"></button>
                    <button type="button" (click)="onDeleteRFALine()" class="delete" title="Remove selected line item"></button>
                  </div>
                  <ag-grid-angular class="ag-theme-balham grdFixed" [gridOptions]="goFixed" [frameworkComponents]="frameworkComponents" id="grdFixed"
                    [columnDefs]="colFixed" [rowData]="fixedData"></ag-grid-angular>
                </div>
              </div>
            </mat-tab>

            <mat-tab label="Project & Remarks Defaults">
              <div class="divRemarks">
                <div class="grdToolbar" id="tbGrid">
                  <button type="button" (click)="onAddRPLine()" class="add" title="Add Line Item"></button>
                  <button type="button" (click)="onDeleteRPLine()" class="delete" title="Remove selected line item"></button>
                </div>
                <ag-grid-angular class="ag-theme-balham grdRemarks" [gridOptions]="goRemarks" id="grdRemarks"
                  [columnDefs]="colRemarks" [rowData]="remarksData"></ag-grid-angular>
              </div>
            </mat-tab>

            <mat-tab label="Exempted Storage Location Categories">
              <div class="divExemptLoc">
                <div class="grdToolbar" id="tbGrid">
                  <button type="button" (click)="onAddRELine()" class="add" title="Add Line Item"></button>
                  <button type="button" (click)="onDeleteRELine()" class="delete" title="Remove selected line item"></button>
                </div>
                <ag-grid-angular class="ag-theme-balham grdExemptLoc" [gridOptions]="goExemptLoc" id="grdExemptLoc"
                  [columnDefs]="colExemptLoc" [rowData]="exemptLocData"></ag-grid-angular>
              </div>
            </mat-tab>
          </mat-tab-group>
      </td>
    </tr>
  </table>
</form>
<footer style="height: 8vh;">
  <button type="button" id="btnHistory" [disabled]="submissionButtonsStatus" matTooltip="Click to view selected Rate Sheet Request History"
          (click)="tbHistory(frmWFRateSheet.get('formId').value)" class="history float-right"
          *ngIf=" frmWFRateSheet.get('stateId').value >= 1"></button>
  <button type="button" id="btnSubmit" [disabled]="submissionButtonsStatus" matTooltip="Click to submit this Rate for approval"
          (click)="tbFormSubmission(frmWFRateSheet.get('formId').value, 2)" class="submit float-right"
          *ngIf="(frmWFRateSheet.get('stateId').value==1 || frmWFRateSheet.get('stateId').value==5) && !frmWFRateSheet.get('completed').value &&
          frmWFRateSheet.get('owner').value==this.footer.createdBy && frmWFRateSheet.get('owner').value==this.currentUserId"></button>
    <button type="button" id="btnCancel" [disabled]="submissionButtonsStatus" matTooltip="Cancel this request to mark this form as completed (Rejected). This form can't be used afterwards"
            (click)="tbFormSubmission(frmWFRateSheet.get('formId').value,99)" class="cancel float-right"
            *ngIf="(frmWFRateSheet.get('stateId').value==1 || frmWFRateSheet.get('stateId').value==5) && !frmWFRateSheet.get('completed').value &&
            frmWFRateSheet.get('owner').value==this.footer.createdBy && frmWFRateSheet.get('owner').value==this.currentUserId"></button>
    <button type="button" id="btnApprove" [disabled]="submissionButtonsStatus" matTooltip="Click to mark this Rate Request as approved"
            (click)="tbFormSubmission(frmWFRateSheet.get('formId').value,2)" class="approve float-right"
            *ngIf="(frmWFRateSheet.get('stateId').value==2 || frmWFRateSheet.get('stateId').value==5) && frmWFRateSheet.get('owner').value==this.currentUserId && !frmWFRateSheet.get('completed').value &&
                frmWFRateSheet.get('owner').value!=this.footer.createdBy"></button>
    <button type="button" id="btnReturn" [disabled]="submissionButtonsStatus" matTooltip="Click to return this Rate Request"
            (click)="tbFormSubmission(frmWFRateSheet.get('formId').value,5)" class="return float-right"
            *ngIf="(frmWFRateSheet.get('stateId').value==2 || frmWFRateSheet.get('stateId').value==5) && !frmWFRateSheet.get('completed').value && frmWFRateSheet.get('owner').value!=this.footer.createdBy
              && frmWFRateSheet.get('owner').value==this.currentUserId"></button>
    <button type="button" id="btnReject" [disabled]="submissionButtonsStatus" matTooltip="Click to reject this Client Rate Request. This Request will no longer be actionable once you reject it!"
            (click)="tbFormSubmission(frmWFRateSheet.get('formId').value, 4)" class="reject float-right"
            *ngIf="(frmWFRateSheet.get('stateId').value==2 || frmWFRateSheet.get('stateId').value==5) && frmWFRateSheet.get('owner').value == this.currentUserId && !frmWFRateSheet.get('completed').value &&
                frmWFRateSheet.get('owner').value != this.footer.createdBy"></button>
  <app-footer [items]="footer"></app-footer>
</footer>
