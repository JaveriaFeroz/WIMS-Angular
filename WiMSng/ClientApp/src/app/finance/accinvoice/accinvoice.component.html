<form [formGroup]="frmAccInvoice">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">{{optionName}}</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <div id="divSave" class="float-left">
            <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"
                    *ngIf="frmAccInvoice.get('workFlowId').value==4 || !frmAccInvoice.get('invoiceNo').value"></button>
          </div>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb100" color="accent">
          <mat-label>Invoice #</mat-label>
          <input formControlName="invoiceNo" #invoiceNo matTooltip="Invoice #, auto generated for new entry" matInput maxlength="10" (keydown.enter)="get(invoiceNo.value)">
        </mat-form-field>
        <input formControlName="invoiceId" hidden>
        <input formControlName="workFlowId" hidden>
      </td>

      <td>
        <mat-form-field class="tb150">
          <mat-label>Invoice Date</mat-label>
          <input matInput [matDatepicker]="mdpDate" [min]="minDate" [max]="maxDate" matTooltip="Invoice Date" formControlName="invoiceDate" required>
          <mat-datepicker-toggle matSuffix [for]="mdpDate"></mat-datepicker-toggle>
          <mat-datepicker #mdpDate></mat-datepicker>
        </mat-form-field>
      </td>

      <td *ngIf="frmAccInvoice.get('workFlowId').value==4">
        <mat-form-field class="tb100">
          <mat-label>Status</mat-label>
          <input formControlName="stateId" matInput hidden>
          <input formControlName="owner" matInput hidden>
          <input formControlName="completed" matInput hidden>
          <input formControlName="stateName" matInput readonly tabindex="-1">
        </mat-form-field>
      </td>      
      <td colspan="2"></td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb250">
          <mat-label>Storer Group</mat-label>
          <mat-select (selectionChange)="loadInvoiceDetail()" formControlName="storerGroupId" #storerGroupId required>
            <mat-option *ngFor="let sg of lstStorerGroup" [value]="sg.groupId">{{sg.groupName}}</mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb200">
          <mat-label>Profit Center</mat-label>
          <mat-select (selectionChange)="loadInvoiceDetail()" formControlName="pcId" required>
            <mat-option *ngFor="let pc of lstProfitCenter" [value]="pc.pcId">{{pc.pcName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb70">
          <mat-label>GST %</mat-label>
          <input type="number" formControlName="gstRate" min="0" step="0.01" max="100" matTooltip="Enter GST Rate" maxlength="5" matInput oninput="validity.valid||(value='');" required>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td  colspan="3">
        <mat-form-field class="tb500">
          <mat-label>Remarks</mat-label>
          <textarea matInput formControlName="remarks" matTooltip="Enter Remarks" maxlength="500"
            cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="2" required></textarea>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="5">
        <div class="divAccInvoice">
          <div class="grdToolbar" id="tbGrid">           
            <button type="button" (click)="onAddLine()" *ngIf="frmAccInvoice.get('workFlowId').value==4" id="btnGridAdd" class="add" title="Add Line Item"></button>                    
            <button type="button" (click)="onDeleteLine()" id="btnGridDelete" class="delete" title="Remove selected line item"></button>
          </div>
          <ag-grid-angular class="ag-theme-balham grdAccInvoice" id="grdAccInvoice" 
            [gridOptions]="goAccInvoice" (cellValueChanged)="onAICellValueChanged($event)"
            [columnDefs]="colAccInvoice" [rowData]="accInvoiceData"></ag-grid-angular>
        </div>
      </td>
      <td colspan="2" >
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer style="height: 8vh;">
    <button type="button" id="btnHistory" [disabled]="submissionButtonsStatus" matTooltip="Click to view selected form history"
      (click)="tbHistory(frmAccInvoice.get('invoiceId').value)" class="history float-right"
      *ngIf="frmAccInvoice.get('workFlowId').value==4 && frmAccInvoice.get('stateId').value>=1"></button>
    <button type="button" id="btnSubmit" [disabled]="submissionButtonsStatus" matTooltip="Click to submit this Form for approval"
      (click)="tbFormSubmission(frmAccInvoice.get('invoiceId').value,2)" class="submit float-right"
      *ngIf="frmAccInvoice.get('workFlowId').value==4 && (frmAccInvoice.get('stateId').value==1 || frmAccInvoice.get('stateId').value==5)
            && !frmAccInvoice.get('completed').value && frmAccInvoice.get('owner').value==this.footer.createdBy && frmAccInvoice.get('owner').value==this.loginUser"></button>
    <button type="button" id="btnCancel" [disabled]="submissionButtonsStatus" matTooltip="Cancel this request to mark this form as completed (Rejected). This form can't be used afterwards"
      (click)="tbFormSubmission(frmAccInvoice.get('invoiceId').value,99)" class="cancel float-right"
      *ngIf="frmAccInvoice.get('workFlowId').value==4 && (frmAccInvoice.get('stateId').value==1 || frmAccInvoice.get('stateId').value==5)
            && !frmAccInvoice.get('completed').value && frmAccInvoice.get('owner').value==this.footer.createdBy  && frmAccInvoice.get('owner').value==this.loginUser"></button>
    <button type="button" id="btnApprove" [disabled]="submissionButtonsStatus" matTooltip="Click to mark this form as approved"
        (click)="tbFormSubmission(frmAccInvoice.get('invoiceId').value,2)" class="approve float-right"
        *ngIf="frmAccInvoice.get('workFlowId').value==4 && frmAccInvoice.get('stateId').value==2 &&
            frmAccInvoice.get('owner').value==this.loginUser && !frmAccInvoice.get('completed').value && frmAccInvoice.get('owner').value!=this.footer.createdBy"></button>
    <button type="button" id="btnReturn" [disabled]="submissionButtonsStatus" matTooltip="Click to return this  Form"
        (click)="tbFormSubmission(frmAccInvoice.get('invoiceId').value,5)" class="return float-right"
        *ngIf="frmAccInvoice.get('workFlowId').value==4 && frmAccInvoice.get('stateId').value==2 &&
            !frmAccInvoice.get('completed').value && frmAccInvoice.get('owner').value!=this.footer.createdBy && frmAccInvoice.get('owner').value==this.loginUser"></button>
    <button type="button" id="btnReject" [disabled]="submissionButtonsStatus" matTooltip="Click to reject this Form. This form will no longer be actionable once you reject it!"
        (click)="tbFormSubmission(frmAccInvoice.get('invoiceId').value,4)" class="reject float-right"
        *ngIf="frmAccInvoice.get('workFlowId').value==4 &&  (frmAccInvoice.get('stateId').value==2  ) && frmAccInvoice.get('owner').value==this.loginUser &&
        !frmAccInvoice.get('completed').value && frmAccInvoice.get('owner').value!=this.footer.createdBy"></button>
  <app-footer [items]="footer"></app-footer>
</footer>
