<form [formGroup]="frmNote">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">{{optionName}}</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <div id="divSave" class="float-left">
            <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"
              *ngIf="frmNote.get('workFlowId').value==5 || !frmNote.get('invoiceNo').value"></button>
          </div>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb100" color="accent">
          <mat-label>Invoice #</mat-label>
          <input formControlName="invoiceNo" #invoiceNo matTooltip="Invoice #, auto generated for new entry" matInput maxlength="10" numbersOnly (keydown.enter)="get(invoiceNo.value)">
        </mat-form-field>
        <input formControlName="invoiceId" hidden>
        <input formControlName="workFlowId" hidden>
      </td>

      <td>
        <mat-form-field class="tb150">
          <mat-label>Invoice Date</mat-label>
          <input matInput [matDatepicker]="mdpDate" [min]="minDate" [max]="maxDate" matTooltip="Invoice Date" formControlName="invoiceDate" required>
          <mat-datepicker-toggle matSuffix [for]="mdpDate"></mat-datepicker-toggle>
          <mat-datepicker #mdpDate></mat-datepicker>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb200">
          <mat-label>Status</mat-label>
          <input formControlName="stateId" matInput hidden>
          <input formControlName="owner" matInput hidden>
          <input formControlName="completed" matInput hidden>
          <input formControlName="stateName" matInput disabled readonly>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb70">
          <mat-label>Amount</mat-label>
          <input type="number" formControlName="amount" maxlength="12" matInput readonly tabindex="-1">
        </mat-form-field>
      </td>
      <td colspan="2"></td>
      <td colspan="2"></td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb100">
          <mat-label>Ref Inv #</mat-label>
          <input formControlName="refInvoiceNo" #refInvoiceNo matTooltip="Ref Invoice #" matInput maxlength="10" numbersOnly (blur)="loadInvoiceDetail(refInvoiceNo.value)" required>
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="tb200">
          <mat-label>Storer Group</mat-label>
          <input formControlName="storerGroupName" matTooltip="Storer Group Name" matInput readonly tabindex="-1">
          <input formControlName="storerGroupId" hidden>
          <!--<mat-select formControlName="storerGroupId" #storerGroupId required readonly tabindex="-1">
    <mat-option *ngFor="let sg of lstStorerGroup" [value]="sg.groupId">{{sg.groupName}}</mat-option>
  </mat-select>-->
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb200">
          <mat-label>Profit Center</mat-label>
          <input formControlName="pcName" matTooltip="Profit Center Name" matInput readonly tabindex="-1">
          <input formControlName="pcId" hidden>
          <!--mat-select formControlName="pcId" required readonly tabindex="-1">
    <mat-option *ngFor="let pc of lstProfitCenter" [value]="pc.pcId">{{pc.pcName}}</mat-option>
  </mat-select>-->
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb70">
          <mat-label>GST %</mat-label>
          <input type="number" formControlName="gstRate" min="0" step="0.10" max="100" matTooltip="Enter GST Rate" maxlength="5" matInput oninput="validity.valid||(value='');" required readonly tabindex="-1">
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="tb100">
          <mat-label>Ref Inv Date</mat-label>
          <input formControlName="refInvoiceDate" matTooltip="Ref Invoice Date" matInput readonly tabindex="-1">
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="tb100">
          <mat-label>Ref Period</mat-label>
          <input formControlName="refPeriod" matTooltip="Ref Period" matInput readonly tabindex="-1">
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="2">
        <mat-form-field class="tb500">
          <mat-label>Remarks</mat-label>
          <textarea matInput formControlName="remarks" #remarks matTooltip="Enter Remarks" maxlength="500"
              cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="2" required></textarea>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="4">
        <mat-tab-group (selectedTabChange)="validateGridStatus()">
          <mat-tab label="Current Invoice Detail">
            <div>
              <div class="grdToolbar" id="tbGrid">
                <button type="button" (click)="onAddLine()" id="btnGridAdd" class="add" title="Add Line Item"></button>
                <button type="button" (click)="onDeleteLine()" id="btnGridDelete" class="delete" title="Remove Select Line Item"></button>
              </div>
              <ag-grid-angular class="ag-theme-balham grdCI" [gridOptions]="goCI"
                (cellValueChanged)="onCICellChanged($event)" [columnDefs]="colCI" [rowData]="ciData"></ag-grid-angular>
            </div>
          </mat-tab>
          <mat-tab label="Revised Invoice Detail">
            <div >
              <div class="grdToolbar" id="tbGrid">
                <button type="button" (click)="onAddRILine()" id="btnGridAdd" class="add" title="Add Line Item"></button>
                <button type="button" (click)="onDeleteRILine()" id="btnGridDelete" class="delete" title="Remove Select Line Item"></button>
              </div>
              <ag-grid-angular class="ag-theme-balham grdRI" [gridOptions]="goRI"
                  (cellValueChanged)="onRICellChanged($event)" [columnDefs]="colRI" [rowData]="riData"></ag-grid-angular>
            </div>
          </mat-tab>
        </mat-tab-group>
      </td>
      <td colspan="2" rowspan="3">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>

  </table>
</form>
<footer style="height: 8vh;">
  <button type="button" id="btnHistory" [disabled]="submissionButtonsStatus" matTooltip="Click to view selected From History"
          (click)="tbHistory(frmNote.get('invoiceId').value)" class="history float-right"
          *ngIf="frmNote.get('workFlowId').value==5 && frmNote.get('stateId').value>=1"></button>
  <button type="button" id="btnSubmit" [disabled]="submissionButtonsStatus" matTooltip="Click to submit this Form for approval"
          (click)="tbFormSubmission(frmNote.get('invoiceId').value,2)" class="submit float-right"
          *ngIf="frmNote.get('workFlowId').value==5 && (frmNote.get('stateId').value==1 || frmNote.get('stateId').value==2 || frmNote.get('stateId').value==5)
            && !frmNote.get('completed').value && frmNote.get('owner').value==this.footer.createdBy"></button>
  <button type="button" id="btnCancel" [disabled]="submissionButtonsStatus" matTooltip="Cancel this request to mark this form as completed (Rejected). This form can't be used afterwards"
          (click)="tbFormSubmission(frmNote.get('invoiceId').value, 99)" class="cancel float-right"
          *ngIf="frmNote.get('workFlowId').value==5 && (frmNote.get('stateId').value==1 || frmNote.get('stateId').value==5) && !frmNote.get('completed').value &&
            frmNote.get('owner').value==this.footer.createdBy && frmNote.get('owner').value==this.loginUser"></button>
  <button type="button" id="btnApprove" [disabled]="submissionButtonsStatus" matTooltip="Click to mark this form as approved"
          (click)="tbFormSubmission(frmNote.get('invoiceId').value, 2)" class="approve float-right"
          *ngIf="frmNote.get('workFlowId').value==5 && (frmNote.get('stateId').value==2 || frmNote.get('stateId').value==5) && frmNote.get('owner').value==this.loginUser
          && !frmNote.get('completed').value && frmNote.get('owner').value!=this.footer.createdBy"></button>
  <button type="button" id="btnReturn" [disabled]="submissionButtonsStatus" matTooltip="Click to return this Form to one level down"
          (click)="tbFormSubmission(frmNote.get('invoiceId').value, 5)" class="return float-right"
          *ngIf=" frmNote.get('workFlowId').value==5 && (frmNote.get('stateId').value==2 || frmNote.get('stateId').value==5) && !frmNote.get('completed').value &&
          frmNote.get('owner').value!=this.footer.createdBy && frmNote.get('owner').value==this.loginUser"></button>
  <button type="button" id="btnReject" [disabled]="submissionButtonsStatus" matTooltip="Click to reject this Form. This form will no longer be actionable once you reject it!"
          (click)="tbFormSubmission(frmNote.get('invoiceId').value, 4)" class="reject float-right"
          *ngIf="frmNote.get('workFlowId').value==5 && (frmNote.get('stateId').value==2||frmNote.get('stateId').value==5) && frmNote.get('owner').value==this.loginUser
          && !frmNote.get('completed').value && frmNote.get('owner').value!=this.footer.createdBy"></button>
  <app-footer [items]="footer"></app-footer>
</footer>
