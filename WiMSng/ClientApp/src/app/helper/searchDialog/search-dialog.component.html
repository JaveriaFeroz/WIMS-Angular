<h2 mat-dialog-title class="mcTitle">{{data.header}}</h2>
<ag-grid-angular id="agGrid" class="ag-theme-balham"
                 [gridOptions]="gridOptions"
                 [columnDefs]="data.columnDefinitions"
                 [rowData]="data.displayData"
                 (rowDoubleClicked)="onRowSelected($event)"
                 [rowMultiSelectWithClick]="false"
                 style="width: 100%; height: 90%;">
</ag-grid-angular>
