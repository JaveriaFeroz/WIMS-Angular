<form [formGroup]="frmST">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Storage Balance</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb250">
          <mat-label>Warehouse</mat-label>
          <mat-select formControlName="whId" #whId required>
            <mat-option *ngFor="let WH of lstWarehouse" [value]="WH.whId">
              {{WH.whName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb150">
          <mat-label>Storer Key</mat-label>
          <input formControlName="storerKey" matTooltip="Enter Storer Key" matInput maxlength="15" required>
          <!--<mat-datepicker-toggle matSuffix [for]="storerKey"></mat-datepicker-toggle>
          <mat-datepicker #storerKey></mat-datepicker>-->
        </mat-form-field>
      </td>
    </tr>
    <tr>
      <td>
        <mat-form-field class="tb150">
          <mat-label>Transaction Date</mat-label>
          <input matInput [matDatepicker]="TransactionDate"  matTooltip="Transaction Date"  formControlName="TransactionDate" required>
          <mat-datepicker-toggle matSuffix [for]="TransactionDate"></mat-datepicker-toggle>
          <mat-datepicker #TransactionDate></mat-datepicker>
        </mat-form-field>
      </td>
    </tr>
    <tr>
      <td>
        <div class="grdToolbar">
          <input type="file" id="UploadFile" (change)="fileUpload($event)" placeholder="Upload file" accept=".xlx,.xlsx">
        </div>
      </td>
    </tr>

    <tr>
      <td colspan="2">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>

  </table>
</form>
