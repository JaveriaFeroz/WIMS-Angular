<form [formGroup]="frmUserMgmt">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">User Management</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
         <!-- <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>-->
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry"  (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td colspan="2">
        <mat-form-field class="tb150" color="accent">
          <mat-label>User Id</mat-label>
          <input formControlName="userId" #userId matTooltip="Enter UserId" matInput maxlength="20" (keydown.enter)="get(userId.value)">
        </mat-form-field>
        
      </td>
      <td class="slider">
        <mat-slide-toggle formControlName="isActive" color="primary">Is Active</mat-slide-toggle>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb200">
          <mat-label>User Name</mat-label>
          <input formControlName="userName" matInput>
        </mat-form-field>
      </td>
     
      <td>
        <mat-form-field class="tb200">
          <mat-label>Branch Name</mat-label>
          <input formControlName="branchName" matInput>
        </mat-form-field>
      </td>
    </tr>    

    <tr>
      <td>
        <mat-form-field class="tb200">
          <mat-label>Branch Name</mat-label>
          <input formControlName="departmentName" matInput>
        </mat-form-field>
      </td>
    
      <td>
        <mat-form-field class="tb200">
          <mat-label>Email</mat-label>
          <input formControlName="email" matInput>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="8">
        <div class="divGrids">
          <ag-grid-angular class="ag-theme-balham grdUserOption" id="grdUserOption"
                           [gridOptions]="goUserOption" [columnDefs]="colUserOption" [rowData]="optionData"></ag-grid-angular>
          <ag-grid-angular class="ag-theme-balham grdUserWarehouse" id="grdUserWarehouse"
                           [gridOptions]="goUserWarehouse" [columnDefs]="colUserWarehouse" [rowData]="warehouseData"></ag-grid-angular>
          <ag-grid-angular class="ag-theme-balham grdUserRole" id="grdUserRole"
                           [gridOptions]="goUserRole" [columnDefs]="colUserRole" [rowData]="roleData"></ag-grid-angular>
        </div>
      </td>
      <td colspan="2">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
