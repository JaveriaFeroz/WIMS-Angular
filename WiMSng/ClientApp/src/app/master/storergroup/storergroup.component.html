<form [formGroup]="frmStorerGroup">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Storer Group</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb100" color="accent">
          <mat-label>Group Id</mat-label>
          <input formControlName="groupId" #groupId matTooltip="Storer Group Id, auto generated for new entry" matInput maxlength="3" numbersOnly (keydown.enter)="get(groupId.value)">
        </mat-form-field>
      </td>
      <td colspan="2" class="slider">
        <mat-slide-toggle formControlName="printWithLetterHead" color="primary" matTooltip="Turn on this flag to print Invoice on plan paper through laser printer and system will add Logo, Company Name & Address">Print Invoice on Plain Paper</mat-slide-toggle>
      </td>
      <td colspan="3"></td>
      <td colspan="2"></td>
    </tr>

    <tr>
      <td >
        <mat-form-field class="tb300">
          <mat-label>Group Name</mat-label>
          <input formControlName="groupName" #groupName matTooltip="Enter storer group Name" matInput maxlength="50" required>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb250">
          <mat-label>Contact Person</mat-label>
          <input formControlName="contactPerson" matTooltip="Enter Contact Person Name" matInput maxlength="30">
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb170">
          <mat-label>Contact #</mat-label>
          <input formControlName="contactNo" matTooltip="Enter Cell #" matInput maxlength="30">
        </mat-form-field>
      </td>

      <td >
        <mat-form-field class="tb100">
          <mat-label>Credit Days</mat-label>
          <input type="number" formControlName="creditDays" min="0" matTooltip="Enter credit days allowed to this customer" matInput maxlength="9">
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb170">
          <mat-label>CW1 Client Id</mat-label>
          <input formControlName="cwClientId" matTooltip="Enter Cargo Wise 1 client Id to be used to interface revenue/credit notes from WiMS to CW1" matInput maxlength="30" required>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb300">
          <mat-label>Name on Invoice</mat-label>
          <input formControlName="nameOnInvoice" matTooltip="Enter alternate name to be printed on Invoice if you want to display some different (legal) Name on invoice, by default storer group name will be shown" matInput maxlength="200" required>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb200">
          <mat-label>Email</mat-label>
          <input formControlName="email" matTooltip="Enter customer email address on which system generated invoice & alerts will be triggered " matInput maxlength="100" required>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb170">
          <mat-label>Fax #</mat-label>
          <input formControlName="faxNo" matTooltip="Enter Fax #" matInput maxlength="30">
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb170">
          <mat-label>NTN #</mat-label>
          <input formControlName="ntn" matTooltip="Enter NTN #" matInput maxlength="15">
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb170">
          <mat-label>STRN #</mat-label>
          <input formControlName="strn" matTooltip="Enter STRN #" matInput maxlength="15">
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="3">
        <mat-form-field class="tb500">
          <mat-label>Address</mat-label>
          <textarea matInput formControlName="address" matTooltip="Enter Customer Address, it will be printed on all official documents including Invoice" maxlength="500"
            cdkTextareaAutosize cdkAutosizeMinRows="2" cdkAutosizeMaxRows="3" required></textarea>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="4">
        <div class="divStorerGroup">
          <div class="grdToolbar" id="tbGrid">
            <button type="button" (click)="onAddLine()" id="btnGridAdd" class="add" title="Add Line Item"></button>
            <button type="button" (click)="onDeleteLine()" id="btnGridDelete" class="delete" title="Remove selected line item"></button>
          </div>
          <ag-grid-angular class="ag-theme-balham grdStorerGroup" id="grdStorerGroup"
            [gridOptions]="goStorerGroup" [columnDefs]="colStorerGroup" [rowData]="storerData"></ag-grid-angular>
        </div>
      </td>
      <td colspan="3">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
